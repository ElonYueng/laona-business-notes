<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老纳看商业｜商业观点笔记</title>
<meta name="description" content="从公开财报及原创消费算例查找商业观点，阅读证据与出处。">
<meta name="robots" content="noindex">
<style>
  :root{--ink:#202a28;--muted:#626e65;--line:#dadfd5;--paper:#f6f7f1;--green:#193d33;--mint:#dbeece}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei UI","PingFang SC",sans-serif}
  header{background:var(--green);color:#fff;padding:20px max(24px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;gap:16px}
  header strong{font-size:18px}header span{color:#d9e8ce;font-size:13px}
  main{max-width:1208px;margin:auto;padding:36px 24px 56px}
  h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,5vw,47px);line-height:1.16;letter-spacing:-.05em}
  .intro{color:var(--muted);margin-top:13px}
  .tools,.presets{display:flex;flex-wrap:wrap;gap:10px}.tools{margin:26px 0 16px}
  input[type=search]{flex:1;min-width:220px}
  input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:white;padding:10px 14px}
  select,button{cursor:pointer}
  .presets{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  .presets button{font-size:13px;background:transparent}
  .presets button[aria-pressed=true],.entry[aria-pressed=true]{background:#eff6e8;border-color:#8ea583}
  .workspace{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,1.75fr);gap:22px;align-items:start}
  .list{display:grid;gap:9px}.meta{color:var(--muted);font-size:13px}
  .entry{text-align:left;padding:14px 16px;width:100%}.entry strong,.entry small{display:block}.entry small{margin-top:5px}
  article{min-width:0;border:1px solid var(--line);border-radius:14px;background:#fff;padding:clamp(18px,4vw,32px)}
  article h2{font-size:clamp(20px,3vw,29px);line-height:1.35;margin:8px 0 12px}
  article h3{font-size:15px;margin-bottom:7px}
  article img{display:block;max-width:100%;width:400px;margin:15px 0;border-radius:8px}
  .status{display:inline-block;padding:3px 10px;border-radius:5px;background:#eef1e7;color:#394a36;font-size:12px}
  .status.verified{background:var(--mint)}
  .block{border-top:1px solid var(--line);padding-top:15px;margin-top:16px}
  a{color:#245c47;text-underline-offset:3px}
  @media(max-width:680px){main{padding:23px 16px 36px}header{padding:16px}.workspace{grid-template-columns:1fr;gap:14px}.tools>select{flex:1}}
</style>
<header><strong>老纳看商业</strong><span>专题资料库</span></header>
<main>
  <h1>商业观点笔记</h1>
  <p class="intro">按主题查找观点，查看证据和原始出处。</p>
  <div class="tools">
    <input id="search" type="search" aria-label="搜索专题" placeholder="搜公司、主题或观点">
    <select id="theme" aria-label="选择主题"></select>
    <select id="status" aria-label="证据状态"></select>
  </div>
  <nav class="presets" id="presets" aria-label="试用路径"></nav>
  <div class="workspace">
    <section class="list" id="results" aria-label="观点列表"></section>
    <article id="detail" aria-label="观点详情"></article>
  </div>
</main>

<script>
  var page;
  function require() { return module.exports; }
  function Page(config) {
    page = {...config, setData(fields) { Object.assign(this.data, fields); render(); }};
  }
</script>
<script>
const episodes = require("../../catalog.js");

const topics = ["全部主题", ...new Set(episodes.map(episode => episode.theme))];
const statuses = ["全部证据状态", "有公开出处", "待核线索", "假设算例"];
const statusKeys = ["", "verified", "lead", "example"];
const presets = [
  {id: "all", label: "全部观点"},
  {id: "ready", label: "找一条能写的选题"},
  {id: "compare", label: "对照利润变化"},
  {id: "pending", label: "看看还有哪些待核"}
];

function search(query, topicIndex, statusIndex) {
  const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return episodes.filter(episode => {
    const text = [episode.title, episode.company, episode.industry, episode.period, episode.theme,
      ...episode.points].join(" ").toLowerCase();
    return (!topicIndex || episode.theme === topics[topicIndex]) &&
      (!statusIndex || episode.status === statusKeys[statusIndex]) &&
      terms.every(term => text.includes(term));
  });
}

Page({
  data: {
    query: "", topics, statuses, presets, topicIndex: 0, statusIndex: 0, preset: "all",
    results: episodes, selected: episodes[0] || null
  },
  applyFilters(query, topicIndex, statusIndex, preset = "") {
    const results = search(query, topicIndex, statusIndex);
    const selected = results.find(episode => episode.id === this.data.selected?.id) || results[0] || null;
    this.setData({query, topicIndex, statusIndex, preset, results, selected});
  },
  onSearch(event) {
    this.applyFilters(event.detail.value, this.data.topicIndex, this.data.statusIndex);
  },
  onTopic(event) {
    this.applyFilters(this.data.query, Number(event.detail.value), this.data.statusIndex);
  },
  onStatus(event) {
    this.applyFilters(this.data.query, this.data.topicIndex, Number(event.detail.value));
  },
  choosePreset(event) {
    const {id} = event.currentTarget.dataset;
    const topicsIndex = id === "compare" ? Math.max(0, topics.indexOf("收入与利润")) : 0;
    const evidenceIndex = id === "ready" ? 1 : id === "pending" ? 2 : 0;
    this.applyFilters("", topicsIndex, evidenceIndex, id);
  },
  clearSearch() {
    this.applyFilters("", 0, 0, "all");
  },
  openEpisode(event) {
    const selected = this.data.results.find(episode => episode.id === event.currentTarget.dataset.id);
    if (selected) this.setData({selected});
  },
  copySource() {
    if (this.data.selected?.source) wx.setClipboardData({data: this.data.selected.source});
  }
});

</script>
<script>
  const byId = id => document.getElementById(id);
  const searchBox = byId("search"), results = byId("results"), detail = byId("detail");
  const themeFilter = byId("theme"), statusFilter = byId("status");
  function node(tag, text, className = "") {
    const element = document.createElement(tag);
    element.textContent = text;
    element.className = className;
    return element;
  }
  function picture(path, name) {
    const image = node("img", "");
    image.src = offlineImages[path];
    image.alt = name;
    return image;
  }
  function block(title, ...content) {
    const section = node("section", "", "block");
    section.append(node("h3", title), ...content);
    return section;
  }
  const presetButtons = page.data.presets.map(({id, label}) => {
    const button = node("button", label);
    button.dataset.id = id;
    button.onclick = () => page.choosePreset({currentTarget:{dataset:{id}}});
    byId("presets").append(button);
    return button;
  });
  page.data.topics.forEach((text, index) => themeFilter.add(new Option(text, index)));
  page.data.statuses.forEach((text, index) => statusFilter.add(new Option(text, index)));

  function render() {
    const {query, results: episodes, selected, topicIndex, statusIndex, preset} = page.data;
    if (searchBox.value !== query) searchBox.value = query;
    themeFilter.value = topicIndex;
    statusFilter.value = statusIndex;
    for (const button of presetButtons) button.setAttribute("aria-pressed", String(button.dataset.id === preset));
    results.replaceChildren(node("p", "找到 " + episodes.length + " 条观点", "meta"));
    for (const episode of episodes) {
      const button = node("button", "", "entry");
      button.setAttribute("aria-pressed", String(episode.id === selected?.id));
      button.append(node("strong", episode.title), node("small", episode.company + " · " + episode.statusLabel, "meta"));
      button.onclick = () => {
        page.openEpisode({currentTarget:{dataset:{id:episode.id}}});
        if (location.protocol === "https:" || location.protocol === "http:") {
          history.replaceState(null, "", "#" + episode.id);
        }
        if (matchMedia("(max-width:680px)").matches) detail.scrollIntoView({block:"start"});
      };
      results.append(button);
    }
    if (!selected) {
      const clear = node("button", "清除筛选");
      clear.onclick = () => page.clearSearch();
      detail.replaceChildren(node("p", "没有符合条件的观点。", "meta"), clear);
      return;
    }
    const source = node(selected.source ? "a" : "p", selected.sourceLabel);
    if (selected.source) source.href = selected.source;
    detail.replaceChildren(node("span", selected.statusLabel, "status " + selected.status), node("h2", selected.title),
      node("p", selected.company + " · " + selected.period, "meta"),
      block("观点", ...selected.points.map(point => node("p", point))),
      block("依据与来源", source, ...selected.images.map((path, index) => picture(path, selected.title + " · 图 " + (index + 1)))));
  }
  searchBox.addEventListener("input", event => page.onSearch({detail:{value:event.target.value}}));
  themeFilter.addEventListener("change", event => page.onTopic({detail:{value:event.target.value}}));
  statusFilter.addEventListener("change", event => page.onStatus({detail:{value:event.target.value}}));
  render();
  if (location.hash) page.openEpisode({currentTarget:{dataset:{id:location.hash.slice(1)}}});
</script>
